[project]
name = "personal-ai-config"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["ruff==0.16.7"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
extend-exclude = ["skills", "plugins", "personal", "licenses"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
