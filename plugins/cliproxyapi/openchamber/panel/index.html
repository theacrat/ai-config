<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
      }
      #root {
        height: 100%;
        padding: 12px;
        box-sizing: border-box;
        overflow-y: auto;
      }
      .cpa-head {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 10px;
      }
      .cpa-head-title {
        flex: 1;
        font-weight: 600;
      }
      .cpa-summary {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-bottom: 10px;
      }
      .cpa-account {
        border: 1px solid var(--oc-border, rgba(127, 127, 127, 0.25));
        border-radius: var(--oc-radius, 8px);
        padding: 10px;
        margin-bottom: 10px;
      }
      .cpa-account-head {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-wrap: wrap;
        margin-bottom: 8px;
      }
      .cpa-account-name {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-weight: 600;
      }
      .cpa-window {
        margin: 7px 0;
      }
      .cpa-window-meta {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        font-size: 12px;
        color: var(--oc-text-muted, inherit);
        opacity: 0.75;
        margin-bottom: 2px;
      }
      .cpa-window-label {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .cpa-window-reset {
        flex-shrink: 0;
      }
      .cpa-error {
        font-size: 12px;
        color: var(--error-text, #e78284);
        margin-top: 6px;
      }
      .cpa-updated {
        font-size: 11px;
        opacity: 0.6;
        margin-top: 4px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="main.js"></script>
  </body>
</html>
