name: Skill manager

on:
  push:
    paths:
      - "plugins/skill-manager/**"
      - "scripts/install.py"
      - "scripts/verify-loaders.py"
      - "scripts/verify-skill-manager.py"
      - "scripts/verify-skill-context.py"
      - "tests/**"
      - "sources.json"
      - "install.sh"
      - ".github/workflows/skill-manager.yml"
  pull_request:
    paths:
      - "plugins/skill-manager/**"
      - "scripts/install.py"
      - "scripts/verify-loaders.py"
      - "scripts/verify-skill-manager.py"
      - "scripts/verify-skill-context.py"
      - "tests/**"
      - "sources.json"
      - "install.sh"
      - ".github/workflows/skill-manager.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - uses: astral-sh/setup-uv@v10.2.0
      - run: python3 -m unittest discover -s tests
      - run: uv run ruff check scripts tests
      - run: uv run ruff format --check scripts tests
      - run: bun install --frozen-lockfile
        working-directory: plugins/skill-manager
      - run: bun run check
        working-directory: plugins/skill-manager
