name: Model discovery

on:
  push:
    paths:
      - "plugins/model-discovery/**"
      - "scripts/verify-model-discovery.py"
      - ".github/workflows/model-discovery.yml"
  pull_request:
    paths:
      - "plugins/model-discovery/**"
      - "scripts/verify-model-discovery.py"
      - ".github/workflows/model-discovery.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/model-discovery
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - run: bun run check
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Check the host verification script
        run: |
          uv run --project ../.. ruff check ../../scripts/verify-model-discovery.py
          uv run --project ../.. ruff format --check ../../scripts/verify-model-discovery.py
      - name: Install the OpenCode V2 verification host
        run: |
          npm install --prefix "$RUNNER_TEMP/opencode-hosts" @opencode/cli@2.0.14
      - name: Verify OpenCode V2
        run: >-
          python3 ../../scripts/verify-model-discovery.py
          --v2 "$RUNNER_TEMP/opencode-hosts/node_modules/@opencode/cli/bin/opencode.exe"
